<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forged · Log in</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.ico" sizes="any"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#000000"><link rel="stylesheet" href="style.css"></head>
<body data-page="auth"><script>try{if(sessionStorage.seen)document.documentElement.classList.add("quick");sessionStorage.seen=1}catch(e){}</script><div id="splash"><img src="logo.png" alt="Forged"></div><main class="auth">
<img class="brand" src="logo.png" alt="Forged"><p class="muted tag">Forge the habit. 30 days at a time.</p>
<form id="f" class="card">
<input id="un" placeholder="Username" hidden autocomplete="username" autocapitalize="none" spellcheck="false">
<input id="em" type="email" placeholder="Email" required autocomplete="email">
<input id="pw" type="password" placeholder="Password (6+ characters)" required minlength="6" autocomplete="current-password">
<button class="btn">Log in</button>
<p class="muted" id="sw">New here? <a href="#" id="tg">Create account</a></p>
</form></main><script type="module" src="app.js"></script></body></html>
